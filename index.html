<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louise Lynge Thorup – UI/UX Designer</title>
<meta name="description" content="Portfolio of Louise Lynge Thorup, UI/UX designer in Copenhagen. Selected UX projects, visual design, service design and motion.">
<meta property="og:title" content="Louise Lynge Thorup – UI/UX Designer">
<meta property="og:description" content="Selected UI/UX, visual, service and motion projects.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&amp;family=Inter:wght@400;500;600&amp;family=Roboto:wght@300&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:inherit;text-decoration:none}a:hover{opacity:0.7}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
@keyframes frIn{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}
.fr-row{animation:frIn 0.9s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline: view()){.fr-row{animation-timeline:view();animation-range:entry 0% cover 28%}}
@keyframes frKB{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}
.fr-media img.fr-kb{animation:frKB 18s ease-in-out infinite alternate}
@keyframes pfScroll{0%,10%{object-position:50% 0%}90%,100%{object-position:50% 100%}}

@media (max-width: 1100px){
.m-head,.m-sec,.m-hero{padding-left:28px!important;padding-right:28px!important}
.m-pnav,.m-fig{padding-left:28px!important;padding-right:28px!important}
.m-fr{padding-left:40px!important;padding-right:40px!important}
.m-visgrid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media (max-width: 760px){
html,body{overflow-x:hidden}
.m-root{min-height:100vh!important}
.m-head{padding:0 20px!important;height:60px!important;font-size:15px!important;gap:12px}
.m-head>button{white-space:nowrap}
.m-nav{gap:16px!important}
.m-hero{padding:48px 20px 72px!important;gap:20px!important}
.m-hero>p:first-child{font-size:20px!important}
.m-lead{font-size:26px!important;line-height:1.35!important}
.m-hero img{width:150px!important;height:150px!important}
.m-sec{padding:0 20px 88px!important}
.m-sec>p:first-child{font-size:14px!important;margin-bottom:24px!important}
.m-uxgrid{grid-template-columns:1fr!important;gap:44px!important}
.m-uxgrid span[style*="font-size: 25px"]{font-size:21px!important;margin-top:10px!important}
.m-uxgrid span[style*="font-size: 17.5px"]{font-size:16px!important}
.m-visgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:28px 14px!important}
.m-visgrid span[style*="font-size: 17px"]{font-size:15px!important}
.m-visgrid span[style*="font-size: 14px"]{font-size:13px!important}
#about>p:first-child{font-size:25px!important}
#about>p:nth-child(2){font-size:17px!important;margin-bottom:32px!important}
.m-things{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important}
.m-statement{font-size:21px!important;margin-top:48px!important}
.m-cv{grid-template-columns:1fr!important;gap:48px!important}
.m-cv span[style*="font-size: 20px"]{font-size:17px!important}
.m-cv span[style*="font-size: 17.5px"]{font-size:14.5px!important}
#contact>p:first-child{font-size:25px!important}
#contact a,#contact span[style*="font-size: 20px"]{font-size:18px!important}
.m-pnav{padding:12px 20px 0!important;font-size:14px!important}
.m-pnav>div{gap:10px!important}
.m-fig{padding:28px 20px 0!important}
.m-fig h1{font-size:28px!important}
.m-fig h1+p{font-size:17px!important}
.m-meta{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:20px 14px!important}
.m-panel{margin-top:32px!important}
.m-panel[style*="padding: 7% 9%"]{padding:6% 5%!important}
.m-row2{grid-template-columns:1fr!important;gap:22px!important;margin-top:48px!important}
.m-row2>div{order:0!important}
.m-row2>div:first-child{order:1!important}
.m-row2>.m-mediacol{order:2!important;flex-direction:column!important}
.m-mediacol>div{width:100%!important;flex:none!important}
.m-photorow{flex-direction:column!important}
.m-photorow>div{width:100%!important;flex:none!important}
.m-cards{grid-template-columns:1fr!important}
.m-cards>div{padding:22px!important}
.m-pn{grid-template-columns:1fr!important;margin-top:64px!important}
.m-pn button{justify-content:flex-start!important;text-align:left!important}
.m-pn button>span:last-child{order:-1}
.m-fig>div[style*="max-width: 620px"]{margin-top:48px!important}
.m-fig div[style*="margin-top: 72px"]{margin-top:48px!important}
.m-fig div[role="tablist"]{padding:0 16px 8px!important;gap:8px!important}
.m-fr{padding:32px 20px 0!important}
.m-fr h1{font-size:32px!important}
.m-fr h1+p{font-size:21px!important}
.m-fr h1+p+p{font-size:17px!important;margin-top:24px!important}
.m-frrow{flex-direction:column!important;gap:24px!important;margin-top:48px!important;align-items:stretch!important}
.m-fritem{flex:none!important;width:100%!important;max-width:100%!important}
.m-frtext{padding-left:0!important;align-items:flex-start!important;gap:20px!important}
.m-frtext h3{font-size:19px!important}
.m-frtext p{font-size:16px!important}
.m-fr .fr-media>p{font-size:17px!important;line-height:1.35!important;width:80%!important}
.m-fr .fr-media:has(>p){aspect-ratio:4/3!important}
.m-hsteps{flex-direction:column!important;gap:20px!important}
.m-hsteps>div{flex:none!important;width:100%!important}
.fr-row{animation:none!important}
}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div class="m-root" style="width: 100%; min-height: 100vh; box-sizing: border-box; background: #ffffff; font-family: Manrope, sans-serif; color: #1c2430">
  <header style="position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,0.94); backdrop-filter: blur(8px)">
    <div class="m-head" style="max-width: 1240px; margin: 0 auto; padding: 0 40px; height: 72px; display: flex; justify-content: space-between; align-items: center; font-size: 18px">
      <button onClick="{{ goIndex }}" style="font-weight: 500; min-height: 44px">Louise Lynge Thorup</button>
      <nav class="m-nav" style="display: flex; gap: 36px"><button onClick="{{ goProjects }}" style="min-height: 44px">Projects</button><button onClick="{{ goAboutSec }}" style="min-height: 44px">About</button><button onClick="{{ goContact }}" style="min-height: 44px">Contact</button></nav>
    </div>
  </header>

  <sc-if value="{{ landing }}" hint-placeholder-val="{{ true }}">
  <main>
    <section class="m-hero" style="max-width: 1240px; margin: 0 auto; padding: 100px 40px 120px; display: flex; flex-direction: column; align-items: center; gap: 30px; text-align: center">
      <p style="margin: 0; font-size: 25px">Hi I’m Louise</p>
      <p class="m-lead" style="margin: 0; font-family: Roboto, sans-serif; font-weight: 300; font-size: 40px; line-height: 1.35; max-width: 820px">UI/UX Designer. Recent graduate of the IT University of Copenhagen. I create aesthetics that support usability.</p>
      <img src="assets/436dc68b55f0664f353b212448309271.jpg" alt="Portrait of Louise" style="width: 175px; height: 175px; border-radius: 20px; object-fit: cover; margin-top: 10px">
    </section>

    <section id="projects" class="m-sec" style="max-width: 1240px; margin: 0 auto; padding: 0 40px 140px">
      <p style="margin: 0 0 40px; font-size: 17.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4a5568">Selected UI/UX projects</p>
      <div class="m-uxgrid" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 60px">
        <sc-for list="{{ ux }}" as="p" hint-placeholder-count="3">
          <button onClick="{{ p.open }}" onMouseEnter="{{ p.enter }}" onMouseLeave="{{ p.leave }}" onFocus="{{ p.enter }}" onBlur="{{ p.leave }}" style="display: flex; flex-direction: column; gap: 6px; text-align: left">
            <div style="{{ p.panelStyle }}"><img src="{{ p.cover }}" alt="{{ p.title }}" style="{{ p.coverStyle }}"><span style="{{ p.pillStyle }}">Read case →</span></div>
            <span style="font-size: 25px; font-weight: 500; margin-top: 16px">{{ p.short }}</span>
            <span style="font-size: 17.5px; line-height: 1.55; color: #4a5568">{{ p.blurb }}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section id="visual" class="m-sec" style="max-width: 1240px; margin: 0 auto; padding: 0 40px 140px; box-sizing: border-box">
      <p style="margin: 0 0 40px; font-size: 17.5px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #4a5568">Visual, service &amp; motion</p>
      <div class="m-visgrid" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 20px">
        <sc-for list="{{ vis }}" as="p" hint-placeholder-count="5">
          <button onClick="{{ p.open }}" onMouseEnter="{{ p.enter }}" onMouseLeave="{{ p.leave }}" onFocus="{{ p.enter }}" onBlur="{{ p.leave }}" style="display: flex; flex-direction: column; gap: 12px; text-align: left; min-width: 0">
            <div style="{{ p.cardBox }}"><sc-if value="{{ p.noVid }}" hint-placeholder-val="{{ true }}"><img src="{{ p.homeImg }}" alt="{{ p.title }}" style="{{ p.cardImg }}"></sc-if><sc-if value="{{ p.hasVid }}" hint-placeholder-val="{{ false }}"><video src="{{ p.homeVid }}" poster="{{ p.homeImg }}" autoplay="" muted="" loop="" playsinline="" aria-label="{{ p.title }}" style="{{ p.cardImg }}"></video></sc-if><span style="{{ p.arrowStyle }}" aria-hidden="true"><svg viewBox="0 0 22 22" width="13" height="13"><path d="M 20.707 1.293 C 21.098 1.683 21.098 2.317 20.707 2.707 L 2.707 20.707 C 2.317 21.098 1.683 21.098 1.293 20.707 C 0.902 20.317 0.902 19.683 1.293 19.293 L 19.293 1.293 C 19.683 0.902 20.317 0.902 20.707 1.293 Z" fill="#000000"></path><path d="M 7 2 C 7 1.448 7.448 1 8 1 L 20 1 C 20.552 1 21 1.448 21 2 L 21 14 C 21 14.552 20.552 15 20 15 C 19.448 15 19 14.552 19 14 L 19 3 L 8 3 C 7.448 3 7 2.552 7 2 Z" fill="#000000"></path></svg></span></div>
            <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 500; line-height: 1.35; color: #1c2430">{{ p.title }} <span style="{{ p.arrowNudge }}">↗</span></span><span style="font-size: 14px; line-height: 1.45; color: #4a5568">{{ p.tagsSlash }}</span></div>
          </button>
        </sc-for>
      </div>
    </section>

    <section id="about" class="m-sec" style="max-width: 1240px; margin: 0 auto; padding: 0 40px 120px; display: flex; flex-direction: column; align-items: center; text-align: center">
      <p style="margin: 0; font-size: 30px; font-weight: 500">A Little Background</p>
      <p style="margin: 6px 0 56px; font-size: 20px; color: #4a5568">Get to know me</p>
      <div class="m-things" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; width: 100%">
        <sc-for list="{{ things }}" as="t" hint-placeholder-count="14">
          <div tabIndex="0" onMouseEnter="{{ t.enter }}" onMouseLeave="{{ t.leave }}" onFocus="{{ t.enter }}" onBlur="{{ t.leave }}" style="position: relative; aspect-ratio: 1; background: #f2f2f2; overflow: hidden"><img src="{{ t.img }}" alt="{{ t.alt }}" style="{{ t.imgStyle }}"><div style="{{ t.textStyle }}">{{ t.text }}</div></div>
        </sc-for>
      </div>
      <div class="m-statement" style="max-width: 940px; margin-top: 80px; font-weight: 300; font-size: 30px; line-height: 1.5">
        <p style="margin: 0">I have a <span style="color: #4a5568; font-weight: 400">strong visual foundation</span> from my bachelor’s in Communication Design at Design School Kolding,</p>
        <p style="margin: 1.5em 0 0">and <span style="color: #4a5568; font-weight: 400">technical depth</span> from my master’s in Digital Design and Interactive Technologies at the IT University of Copenhagen.</p>
      </div>
    </section>

    <section class="m-sec m-cv" style="max-width: 1240px; margin: 0 auto; padding: 0 40px 120px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 80px">
      <div><p style="margin: 0 0 20px; font-size: 25px; font-weight: 500; text-align: center">Experience</p><sc-for list="{{ exp }}" as="r" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; gap: 20px; padding: 15px 0"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 500; color: #1c2430">{{ r.a }}</span><span style="font-size: 17px; color: #4a5568">{{ r.b }}</span></div><span style="font-size: 18px; font-weight: 500; color: #1c2430; white-space: nowrap">{{ r.c }}</span></div></sc-for></div>
      <div><p style="margin: 0 0 20px; font-size: 25px; font-weight: 500; text-align: center">Education</p><sc-for list="{{ edu }}" as="r" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; gap: 20px; padding: 15px 0"><div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 20px; font-weight: 500; color: #1c2430">{{ r.a }}</span><span style="font-size: 17px; color: #4a5568">{{ r.b }}</span></div><span style="font-size: 18px; font-weight: 500; color: #1c2430; white-space: nowrap">{{ r.c }}</span></div></sc-for></div>
    </section>

    

    <section id="contact" class="m-sec" style="max-width: 1240px; margin: 0 auto; padding: 0 40px 140px; display: flex; flex-direction: column; align-items: center; gap: 26px; text-align: center">
      <p style="margin: 0 0 8px; font-size: 30px; font-weight: 500">Get in touch!</p>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17.5px; color: #4a5568">Email</span><a href="mailto:louise.lynge@hotmail.com" style="font-size: 20px; font-weight: 500">louise.lynge@hotmail.com</a></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17.5px; color: #4a5568">Phone</span><span style="font-size: 20px; font-weight: 500">+45 28736886</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17.5px; color: #4a5568">Located</span><span style="font-size: 20px; font-weight: 500">Copenhagen</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17.5px; color: #4a5568">LinkedIn</span><a href="https://www.linkedin.com/in/louise-lynge-thorup-676348204" style="font-size: 20px; font-weight: 500">Let’s connect!</a></div>
    </section>
  </main>
  </sc-if>

  <sc-if value="{{ isProject }}" hint-placeholder-val="{{ false }}">
  <div class="m-pnav" style="max-width: 1236px; margin: 0 auto; padding: 24px 68px 0; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; font-size: 15px">
    <button onClick="{{ goIndex }}" style="min-height: 44px; display: flex; align-items: center; gap: 8px; color: #4a5568"><span aria-hidden="true">←</span> All projects</button>
    <div style="display: flex; align-items: center; gap: 20px; color: #4a5568"><button onClick="{{ prv.go }}" style="min-height: 44px">← Previous</button><span aria-hidden="true" style="color: #c4c9d0">|</span><span style="color: #1c2430; font-weight: 500">{{ posLabel }}</span><span aria-hidden="true" style="color: #c4c9d0">|</span><button onClick="{{ nxt.go }}" style="min-height: 44px">Next →</button></div>
  </div>
  <sc-if value="{{ isFigmaPage }}" hint-placeholder-val="{{ true }}">
  <article class="m-fig" style="max-width: 1236px; margin: 0 auto; padding: 48px 68px 0; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; gap: 22px; max-width: 640px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 400; line-height: 1.2">{{ caseTitle }}</h1>
      <p style="margin: -8px 0 0; font-size: 18px; line-height: 1.5; color: #4a5568">{{ cur.sub }}</p>
      <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4a5568">{{ cur.intro }}</p>
    </div>
    <sc-if value="{{ showMeta }}" hint-placeholder-val="{{ false }}"><div class="m-meta" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 36px"><sc-for list="{{ cur.meta }}" as="m" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 6px; padding-top: 14px; border-top: 1px solid #e4e7eb"><span style="font-size: 14px; color: #4a5568">{{ m.k }}</span><span style="font-size: 15px; font-weight: 500; line-height: 1.45">{{ m.v }}</span></div></sc-for></div></sc-if>
    <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="4">
      <sc-if value="{{ b.isPanel }}" hint-placeholder-val="{{ true }}"><div class="m-panel" style="{{ b.boxStyle }}"><sc-for list="{{ b.imgs }}" as="im" hint-placeholder-count="1"><sc-if value="{{ im.hasSrc }}" hint-placeholder-val="{{ true }}"><div style="{{ im.wrap }}"><sc-if value="{{ im.isPic }}" hint-placeholder-val="{{ true }}"><img src="{{ im.src }}" alt="{{ im.label }}" loading="lazy" onLoad="{{ im.onLoad }}" style="{{ im.style }}"></sc-if><sc-if value="{{ im.isVid }}" hint-placeholder-val="{{ false }}"><video src="{{ im.vsrc }}" poster="{{ im.src }}" autoplay="" muted="" loop="" playsinline="" preload="metadata" aria-label="{{ im.label }}" style="{{ im.style }}"></video></sc-if></div></sc-if><sc-if value="{{ im.noSrc }}" hint-placeholder-val="{{ false }}"><div style="{{ im.phStyle }}">[Image: {{ im.label }}]</div></sc-if></sc-for></div></sc-if>
      <sc-if value="{{ b.isRow }}" hint-placeholder-val="{{ false }}"><div class="m-row2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center; margin-top: 72px">
        <div style="{{ b.textCol }}"><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin: 0; font-size: 18px; font-weight: 500; color: #1c2430">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasT }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4a5568">{{ b.t }}</p></sc-if><sc-if value="{{ b.hasQuote }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 36px; border-radius: 6px; background: #cfe5fb; font-family: Roboto, sans-serif; font-weight: 300; font-size: 26px; line-height: 1.35; color: #1c2430">{{ b.quote }}</p></sc-if><sc-for list="{{ b.textImgs }}" as="im" hint-placeholder-count="0"><sc-if value="{{ im.hasSrc }}" hint-placeholder-val="{{ true }}"><div style="{{ im.wrap }}"><sc-if value="{{ im.isPic }}" hint-placeholder-val="{{ true }}"><img src="{{ im.src }}" alt="{{ im.label }}" loading="lazy" onLoad="{{ im.onLoad }}" style="{{ im.style }}"></sc-if><sc-if value="{{ im.isVid }}" hint-placeholder-val="{{ false }}"><video src="{{ im.vsrc }}" poster="{{ im.src }}" autoplay="" muted="" loop="" playsinline="" preload="metadata" aria-label="{{ im.label }}" style="{{ im.style }}"></video></sc-if></div></sc-if><sc-if value="{{ im.noSrc }}" hint-placeholder-val="{{ false }}"><div style="{{ im.phStyle }}">[Image: {{ im.label }}]</div></sc-if></sc-for></div>
        <div class="m-mediacol" style="{{ b.mediaCol }}"><sc-for list="{{ b.imgs }}" as="im" hint-placeholder-count="1"><sc-if value="{{ im.hasSrc }}" hint-placeholder-val="{{ true }}"><div style="{{ im.wrap }}"><sc-if value="{{ im.isPic }}" hint-placeholder-val="{{ true }}"><img src="{{ im.src }}" alt="{{ im.label }}" loading="lazy" onLoad="{{ im.onLoad }}" style="{{ im.style }}"></sc-if><sc-if value="{{ im.isVid }}" hint-placeholder-val="{{ false }}"><video src="{{ im.vsrc }}" poster="{{ im.src }}" autoplay="" muted="" loop="" playsinline="" preload="metadata" aria-label="{{ im.label }}" style="{{ im.style }}"></video></sc-if></div></sc-if><sc-if value="{{ im.noSrc }}" hint-placeholder-val="{{ false }}"><div style="{{ im.phStyle }}">[Image: {{ im.label }}]</div></sc-if></sc-for></div>
      </div></sc-if>
      <sc-if value="{{ b.isText }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 12px; max-width: 620px; margin-top: 72px"><sc-if value="{{ b.hasH }}" hint-placeholder-val="{{ true }}"><h2 style="margin: 0; font-size: 18px; font-weight: 500; color: #1c2430">{{ b.h }}</h2></sc-if><sc-if value="{{ b.hasT }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4a5568">{{ b.t }}</p></sc-if><sc-if value="{{ b.hasQuote }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 36px; border-radius: 6px; background: #cfe5fb; font-family: Roboto, sans-serif; font-weight: 300; font-size: 26px; line-height: 1.35; color: #1c2430">{{ b.quote }}</p></sc-if></div></sc-if>
      <sc-if value="{{ b.isPhotos }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 12px; margin-top: 32px"><sc-for list="{{ b.rows }}" as="row" hint-placeholder-count="1"><div class="m-photorow" style="display: flex; gap: 12px; align-items: flex-start"><sc-for list="{{ row.imgs }}" as="im" hint-placeholder-count="3"><sc-if value="{{ im.hasSrc }}" hint-placeholder-val="{{ true }}"><div style="{{ im.wrap }}"><sc-if value="{{ im.isPic }}" hint-placeholder-val="{{ true }}"><img src="{{ im.src }}" alt="{{ im.label }}" loading="lazy" onLoad="{{ im.onLoad }}" style="{{ im.style }}"></sc-if><sc-if value="{{ im.isVid }}" hint-placeholder-val="{{ false }}"><video src="{{ im.vsrc }}" poster="{{ im.src }}" autoplay="" muted="" loop="" playsinline="" preload="metadata" aria-label="{{ im.label }}" style="{{ im.style }}"></video></sc-if></div></sc-if><sc-if value="{{ im.noSrc }}" hint-placeholder-val="{{ false }}"><div style="{{ im.phStyle }}">[Image: {{ im.label }}]</div></sc-if></sc-for></div></sc-for></div></sc-if>
      <sc-if value="{{ b.isTabs }}" hint-placeholder-val="{{ false }}"><div style="margin-top: 56px; padding: 24px 0 0; border-radius: 6px; background: #ffffff; border: 1px solid #ececec"><div role="tablist" aria-label="{{ b.tabLabel }}" style="display: flex; flex-wrap: wrap; gap: 12px; padding: 0 28px 8px"><sc-for list="{{ b.tabs }}" as="tb" hint-placeholder-count="4"><button role="tab" aria-selected="{{ tb.sel }}" onClick="{{ tb.pick }}" style="{{ tb.style }}">{{ tb.label }}</button></sc-for></div><img src="{{ b.tabSrc }}" alt="{{ b.tabAlt }}" style="display: block; width: 100%; height: auto; border-radius: 0 0 6px 6px"></div></sc-if>

<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'index', pid: 'aeldre', hovered: null, hoveredThing: null };
  }
  renderVals() {
    const ALLOW_SPLIT = true;
    const b = (id) => '/_blob/' + id;
    const ui = (id, label, bg) => ({ src: b(id), label, fit: 'panel', bg: bg || '#eef3f8' });
    const ph = (id, label) => ({ src: b(id), label, fit: 'cover', bg: '#e9e9e9' });
    const fl = (id, label, bg) => ({ src: b(id), label, fit: 'contain', bg: bg || '#ffffff' });
    const sec = (h, t, imgs, o) => ({ h, t, imgs: imgs || [], layout: (o && o.layout) || 'stack', quote: (o && o.quote) || '', cards: (o && o.cards) || [] });
    const P = [
      { id: 'aeldre', title: 'Ældre Sagen’s Digital Member Universe', short: 'Ældre Sagen', sub: 'Personalisation as a design strategy for the transition to retirement', tags: 'Co-design · UX/UI · Thesis', year: '2026', img: b('9bce70a9d8f2935c8eaf4f280e2f8fa3'), bg: '#ffffff', fit: 'cover', pos: 'center',
        meta: [['Collaborator', 'Ældre Sagen'], ['Type', 'Master’s thesis, UX/UI'], ['Technologies', 'Figma'], ['Methods & Tools', 'Qualitative interviews, co-design workshops, iterative prototyping, think-aloud tests, design system']],
        intro: 'The transition from working life to retirement is one of the most significant life changes a person goes through, yet digital platforms rarely design for it. In collaboration with Ældre Sagen, this thesis explores how personalisation can support motivation and perceived relevance for members navigating that transition, using their upcoming digital member platform DiBU as the design context. Working across qualitative interviews, co-design workshops, and three rounds of iterative prototyping, we developed DiBU 2.0: a conceptual high-fidelity prototype that introduces a personalised member experience.',
        sections: [
          sec('The personalisation flow', 'The personalisation flow is designed as an invitation where members choose how much they share across nine skippable steps. The platform then balances that input with system-driven recommendations based on life stage and behaviour.', [ui('dcc03c6b446288918ab78c44cfe08836', 'Step 1 of 9', '#b5dafb'), ui('c8df22e841d5558704a6144ee7b351c4', 'Step 4 of 9', '#b5dafb')], { layout: 'split' }),
          sec('Activities & benefits', 'Content is tagged to show whether a recommendation is based on personal interests or local popularity, keeping the experience transparent. A map view allows members to explore activities by location, and filters for date and type make the offering easy to navigate without narrowing it down completely.', [ui('08c05d4482e015d21fe1c37e54e0cfb6', 'Activities and benefits', '#b5dafb')], { layout: 'split' }),
          sec('Co-creation workshops', 'Two co-design workshops placed participants as active contributors rather than informants, surfacing needs and tensions that interviews alone would not have reached. Their language, priorities, and contradictions directly shaped the design decisions made throughout the process.', [ph('c3a46a0349a3f09da259d956ac95fdb3', 'Collage workshop'), fl('13007e508b89617417d3cd557f139ba9', 'Collage from the workshop')], { layout: 'split' }),
          sec('Personalised retirement guidance', 'The knowledge and guidance section gives members access to structured information on economy, housing, healthcare, and everyday life. The content is designed to be relevant to where the member is in their transition, not a generic overview of what retirement might eventually involve.', [ui('265a6426cb43b6a4d8b0c59235aed533', 'Knowledge and guidance', '#b5dafb')], { layout: 'split' }),
          sec('My profile', 'Members can view and adjust their personalisation data at any time, seeing what the platform knows about them and updating it as their situation changes. This transparency gives members direct control over how the platform adapts to them.', [ui('3a7ec89830d14d570111719d9463bc13', 'My profile', '#b5dafb')], { layout: 'split' }),
          sec('Standard vs. personalised', 'The same member page with standard data and with personalisation applied.', [ui('65e860347ccc472d74f19f530f05fb73', 'Standard', '#eef3f8'), ui('5320b9565f805c0c1497d5947a8f9c34', 'Personalised', '#eef3f8')])
        ] },
      { id: 'opiaid', title: 'OPI-AID', short: 'OPI-AID', sub: 'AI decision support for post-operative opioid dosing', tags: 'UX/UI · Health tech', year: '2025', img: b('3baf5ea6ee8583a52a0ebfc9c6d4d9a1'), bg: '#6bb5b3', fit: 'contain', pos: 'center',
        meta: [['Collaborator', 'CEPRA'], ['Type', 'Group exam project, Digital Innovation in Practice'], ['Technologies', 'Figma'], ['Methods & Tools', 'Observation, cross-country interviews, user journey mapping, low-fidelity sketches, prototyping, testing']],
        intro: 'Every year, 300 million surgeries are performed worldwide, yet there are no standardised guidelines for postoperative opioid dosing. In collaboration with CEPRA, we designed a web-based interface for the decision-support tool, OPIAID, to help anaesthesiologists calculate personalised opioid doses using a predictive AI model. The tool was designed to work across different national healthcare systems, and our process was grounded in fieldwork, cross-country interviews, and iterative prototyping with real clinical users.',
        sections: [
          sec('New assessment', 'New Assessment is the core of OPIAID. Clinicians enter 15–20 patient predictors and receive a recommended dose, predicted pain levels, and potential side effects. Inputs can be added through text, voice, files, or photos. Clinicians can adjust the recommendation or choose an alternative medication, with the system asking for a brief justification.', [fl('f82a09aea5a955617824121e7fa88350', 'Process: from initial exploration to testing and iteration', '#f4f4f4')], { layout: 'split' }),
          sec('Different workflows and needs', 'The interviews revealed both shared challenges and country-specific needs. Germany inspired an AI-assisted photo input, while the UK highlighted the need for standardisation. Sweden emphasised multimodal pain management and post-operative feedback. Across all countries, clinicians wanted AI to support and not replace their professional judgment.', [fl('96d29dd3333c67e27df1b4fd35f3a73a', 'User journey before, during and after surgery', '#f4f4f4')]),
          sec('Fieldwork', 'Observation at Bispebjerg Hospital gave us a first-hand look at the post-operative workflow.', [ph('8d0946ce0445a509bc5f293d4d1cfd5f', 'Observation at Bispebjerg Hospital'), ph('7bc438b10eaaa6d0a9e898e608dfed04', 'From the observation')]),
          sec('Your History page', 'The Your History page gives each healthcare professional a personal log of all previous assessments. It shows which predictors were used, what dose was recommended and what was ultimately administered, and whether post-operative feedback has been added. The page is designed to support reflection and learning over time, allowing clinicians to evaluate their own decisions and track patterns across patients.', [ui('f6b07a3a01147c79e4e04df5b9fa33f9', 'Your History', '#6bb5b3')], { layout: 'split' }),
          sec('Feature highlights', '', [], { cards: [
            ['Opioid dose prediction', 'The core functionality of OPIAID, where the system predicts the optimal opioid. The user can input a variety of patient data and receive real-time, personalized opioid dosage recommendations.'],
            ['Input flexibility', 'The interface offers flexibility by supporting multiple input methods, ensuring integration with both digital and paper-based record-keeping systems across diverse hospital environments.'],
            ['Visual risk assessment', 'Each opioid dose recommendation is accompanied by a visual representation of risk, highlighting the likelihood of pain and potential side effects. This visual guide empowers clinicians to adjust dosages based on each patient’s specific needs and medical context.'],
            ['Transparency', 'OPIAID ensures transparency by providing insights into how the algorithm arrived at its recommendations. It displays the factors influencing dosage predictions, building trust and enabling clinicians to make informed, confident decisions.'],
            ['Alternative dosages and medications', 'Clinicians can select alternative dosages or medications, with a required justification for their choices. This flexibility ensures that OPIAID adapts to real-world medical decision-making while maintaining accountability and fostering clinical judgment.'],
            ['Post-op feedback', 'After surgery, clinicians are prompted to provide feedback on the effectiveness of the prescribed opioid dosage. This feedback is essential for refining the algorithm, improving accuracy, and ensuring the system evolves based on real-world data.']] }),
          sec('Final screens', '', [ui('f543706c3493ac14318f5288f28b4aee', 'Front page', '#6bb5b3'), ui('1f02a4daea845bca91130b46974bfae9', 'Adjusting the dose', '#6bb5b3'), ui('8fabb21d0e1feaa1009f4678c97acc01', 'Archive', '#6bb5b3')])
        ] },
      { id: 'onske', title: 'Ønskeskyen redesign', short: 'Ønskeskyen', sub: 'From transactional wishlists to relational gift-giving', tags: 'UX/UI · Redesign · Co-design', year: '2024', img: b('1685675064406c52cb7753402c36577d'), bg: '#cfe5fb', fit: 'contain', pos: 'center',
        meta: [['Collaborator', 'Super-users aged 17–23'], ['Type', 'Group project, Advanced Design Processes'], ['Technologies', 'Figma'], ['Methods & Tools', 'Interaction criticism, co-design workshop, 635 brainwriting, concept walk-through, usability testing']],
        intro: 'Ønskeskyen is Denmark’s leading digital wishlist platform, but its link-based model reduces gift-giving to a transaction: the recipient dictates the gift, and the giver’s personal touch disappears. In collaboration with a group of super-users aged 17 to 23, we investigated how a redesign could shift that balance. Our focus was on two core features: a reimagined wish creation flow that moves away from product links, and a Gift Generator that connects giver and receiver through shared interests rather than commercial recommendations.',
        sections: [
          sec('Create a wish', 'Ønskeskyen’s existing wish creation heavily prioritises product links, making wishlists feel like order forms. The redesign makes it easy and attractive to wish for things without links, prompting the user to choose between material and experiential categories and indicate whether second-hand is welcome. An AI-generated image feature visualises wishes that cannot be bought online, opening the space for gifts that are harder to define but more meaningful to receive.', [fl('fd6ea0cb3314f5ac4bf57f3852a2fad1', 'Create a wish flow', '#cfe5fb')], { layout: 'split' }),
          sec('Co-creation workshop', 'A two-hour co-design workshop with four super-users placed participants as co-experts, using five activities to surface how they actually experience gift-giving and what feels meaningful to them.', [ph('c939562cf981581f9feef1bc940facec', 'Workshop'), ph('f19ccb4bb4aa34e08ad5972c019a987a', 'The Great Gift Game'), ph('5bd8c1d49211a769e2dff6c4cd590c1f', 'Scenario card')]),
          sec('The Great Gift Game', 'The game used a board, pieces and scenario cards such as “If you were to give me a creative gift, what would it be?”. A key insight: the gifts participants saw as most meaningful rarely came from Ønskeskyen. Creative gifts and experiences stood out instead. As one participant said: “I’ve made a book of memories… it shows that they value your friendship.”', [ph('96da546ee8d67e60390876e3a4abda84', 'The game board'), ph('44ac2c4243ef63fc9eef4e1dc80612be', 'Workshop at a participant’s home')], { layout: 'split' }),
          sec('Ideation and focus', 'Through 635 brainwriting we explored ideas inspired by social media: a personal moodboard, interest tags and shared memories. A design critique showed the prototype was too unfocused, so we narrowed it down to three core features: Create profile, Create wish and the Gift Generator.', [ph('d2dd55484a36c1ad28d3625cdbc7221e', 'Sketching the concept')], { layout: 'split' }),
          sec('Gift Generator', 'The Gift Generator replaces advertising with relevance. By drawing on the shared interest tags of both giver and receiver, it generates personalised gift suggestions rooted in the relationship between them rather than commercial logic. It also offers inspiration for making a gift more personal or sustainable, adding a layer of thoughtfulness to the process.', [fl('e9aabef717895801e67035ebe0621f55', 'Gift Generator flow', '#cfe5fb')], { layout: 'split' }),
          sec('Testing the redesign', 'We tested with two friends through concept walk-through and usability testing. Making a shared moodboard, they discovered new sides of each other’s style: “This picture kind of reminds me of you.” The extra steps in the Gift Generator were seen as a quality: “For people like us, I think it would be great.”', [ph('9f34e368acf7382c3ac39217d9d9c37e', 'Testing the prototype'), ph('f8fb4f0e0d20b2996716aca1b586dde7', 'Presenting at the expo')])
        ] },
      { id: 'bach', title: 'BachMouritsen SoMe', short: 'BachMouritsen SoMe', sub: 'Filming, editing and creating visuals for commercials', tags: 'Graphic design · Visual identity · Video editing · Animation', year: '2021', img: b('e6544d121ad77dcd43646ba0cd39221f'), bg: '#1c1c1c', fit: 'cover', pos: 'center',
        meta: [['Collaborator', 'BachMouritsen'], ['Type', 'Graphic design, visual identity, video editing, animation'], ['Technologies', 'Illustrator, DaVinci Resolve, After Effects'], ['Methods & Tools', 'Developing the company’s visual style for SoMe in accordance with their visual identity, creating SoMe posts, assisting in filming, editing and creating animations for the video.']],
        intro: 'BachMouritsen, a luxury jeweler and diamond company, sought a SoMe campaign to promote their latest jewelry collections, Chepré and Variété, inspired by art. My responsibilities involved developing their current visual identity to align with SoMe platforms, creating SoMe posts, filming assistant, editing, and creating animations for the video for the collection Chepré. This project was done during my internship at Plateau Agency.',
        sections: [
          sec('The campaign feed', '', [ui('b19958529f40bccae6a1b755960cc8ca', 'The campaign on Instagram', '#f4f4f4')]),
          sec('Visual identity for SoMe', 'The posts pair the jewellery with art and historical imagery that tells the stories behind the collections.', [ph('0d75178846735c75faae4c7c61176c0f', 'Variété'), ph('0a59e6c43c0ab70513eb55858085bb1f', 'Art and storytelling'), ph('964dd6e57864b63b9b22dc8877e01a97', 'Behind the typography')]),
          sec('Animation', '', [fl('700486367ba8aaa588be601f3acc0f10', 'Variété animation', '#1c1c1c'), ui('5ce756bbf9fdc0517e95570a08c281fd', 'The feed on mobile', '#f4f4f4')])
        ] },
      { id: 'art', title: 'Engaging a wider audience in art', short: 'Art for everyone', sub: 'Activating non connoisseurs at Art Museum Brandts', tags: 'User research · Graphic design', year: '2022', img: b('ebcd36cd86043f7b2013c2f8911ee6ff'), bg: '#dff2fb', fit: 'contain', pos: 'center',
        meta: [['Collaborator', 'Art Museum Brandts'], ['Type', 'User research, graphic design'], ['Technologies', 'InDesign, Figma, Photoshop'], ['Methods & Tools', 'Academic research, semi-structured interviews, surveys, service safari, user journey, prototyping, testing']],
        intro: 'Art Museum Brandts, a state-funded institution, aims to make art accessible to all. However, there is a significant focus on the art connoisseur when creating the exhibitions, making the exhibitions challenging to engage with without the proper prior knowledge. To address this, we’re integrating a book into the exhibition. The structured guide leads visitors through, fostering both personal exploration and group discussion.',
        sections: [
          sec('', '', [fl('a319bf36622538af1b2fd03a9bda7196', 'In the museum', '#e9e9e9')]),
          sec('Segment groups', 'The museum presented us with 4 segment groups from which we chose to focus on a specific group called the “affirmers”. This segment consists of individuals with limited experience in experiencing art but who wish to expand their cultural horizons.', [fl('6e8621b78c5a1420958e20a34a94f3c6', 'The four segment groups', '#ffffff')], { layout: 'split' }),
          sec('User research', 'We studied two exhibitions, “Samlingen – 250 years of Danish art” and Kathrine Ærtebjerg’s “De tusind gåders sted”, through interviews, surveys and a conversation with a museum curator.', [ph('6f4e4a45fb1e5bc2882014babf553565', 'The two exhibitions')], { layout: 'split' }),
          sec('Exhibition experience', 'Through a service safari we experienced the exhibitions as the segment group would, to understand where the experience falls short without prior knowledge.', [ph('2b2dfaf9f9bee294c0fffe775dbcab06', 'In the exhibition')], { layout: 'split' }),
          sec('Analysing insights', 'We mapped the user journey through the collection. The analysis showed that the affirmers are unsure of their own abilities, are looking for the “right” answers, and focus on how the museum communicates the art.', [ph('0f81c20cbded8ac84f80e37ad1a04394', 'User journey through the collection'), ph('8f0b281ecd3bd24ee7e8b52e1ac40767', 'Partial conclusion')]),
          sec('Prototype & test', 'We prototyped a guide book that leads visitors through the exhibition with open questions, and tested it in the museum.', [ph('360fff04c7c1abc86102fee6503fb257', 'Guide book'), ph('fd960670bc3dffcb91b31eff008bd078', 'The design solution')]),
          sec('The guide book in the collection', '', [ph('0608123a988f4b9727a9850d09eb03bb', 'Guide book in the collection'), ph('0818b0f6b048042d9aef17056e8a6370', 'Guide book in the collection'), ph('dcff4aff7432ef26a7b79dca24908f0f', 'Guide book in the collection'), ph('40fb8557134b196cd7fcfce1f7e98238', 'Guide book in the collection'), ph('2f1049a617c8580a91a0e79af467d407', 'Guide book in the collection'), ph('1a22860c7e537c6b43fd907b01da9a78', 'Guide book in the collection')])
        ] },
      { id: 'awe', title: 'Creativity is ‘awe’some', short: 'Creativity is ‘awe’some', sub: 'Boosting creativity through awe', tags: 'Service design', year: '', img: b('55d6f66d187fed46b2582a83e1765052'), bg: '#4d6369', fit: 'cover', pos: 'center top',
        meta: [['Collaborator', 'Master studies project with external company'], ['Type', 'Service design'], ['Technologies', 'Figma, Miro, Illustrator'], ['Methods & Tools', 'Desktop research, workshop facilitation, user journey, service blueprint, service origami, subtext, stakeholder mapping, storyboard']],
        intro: 'The project investigates how introducing awe in your everyday life can boost your creativity. The brief was given by an external company that wanted to foster an innovative culture in their workplace by implementing the 20% rule. Our service introduces a set of tools that utilize awe to boost the creativity of the employees.',
        sections: [
          sec('', '', [fl('b95e03c12d05b219ef31f6bf18a4e2f5', 'Design process', '#ffffff')]),
          sec('', '', [fl('022a43dbfa9b0a00d8038311979ec5a2', 'Creativity, innovation, social behaviour and broadening horizons', '#ffffff')], { layout: 'split', quote: 'Awe is the feeling we get in the presence of something vast that challenges our understanding of the world (Keltner, 2023)' }),
          sec('Defining project scope and problem area', '', [ph('c8423056c7aa41694f03545a89ec2036', 'Affinity mapping')], { layout: 'split', quote: '“HMW design a service that leverages awe to enable creativity in support of the 20% model for employees?”' }),
          sec('Investigating awe and developing service concept', 'Through a co-creation workshop, we investigated the connection between creativity and awe, uncovering underlying needs and values. Our aim was to explore diverse awe experiences and their triggers, and the participants’ mental state before, during and after their awe experiences.', [ph('7bd84190b2fe9ab6b06888d779f29407', 'Co-creation workshop'), fl('3a8946a57275b6c7fbbc122b2a1a04d0', 'Workshop material', '#dff2fb'), fl('55900fb4eae1a6cb0211d3c1c1de8c8b', 'User journey and service blueprint', '#dff2fb')]),
          sec('Prototyping service concept', 'Through service origami and subtext we prototyped the service concept.', [ph('a2117bc16d8acbd614fdebf3ec205b8b', 'Service origami'), fl('607cfe32653ad77e9f34d363ab05b99c', 'Subtext', '#dff2fb')]),
          sec('Communication service concept', 'Visualizing the concept and implementation of the platform.', [fl('55d6f66d187fed46b2582a83e1765052', 'Storyboard', '#4d6369'), fl('44191c121f7968be0a85485090a76d83', 'Storyboard', '#4d6369')])
        ] },
